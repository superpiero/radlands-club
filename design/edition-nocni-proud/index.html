<script>
"use strict";
{
const CARDS = {
  pumpar: {name: "Pumpař", type: "Přeživší", cost: 1, attack: 1, uses: 2, rule: "Zasáhne základnu za 1. Po každém útoku získáš 1 vodu.", flavor: "Dokud se točí kolo, osada žije."},
  bara: {name: "Brokovnice Bára", type: "Přeživší", cost: 3, attack: 2, uses: 2, rule: "Zasáhne základnu za 2. Po druhém výpadu se stáhne z fronty.", flavor: "K její cisterně se nikdo nepřiblíží dvakrát."},
  pramen: {name: "Skrytý pramen", type: "Operace", cost: 0, gain: 2, rule: "Okamžitě získáš 2 vody, nejvýš do zásoby 5. Poté kartu odlož.", flavor: "Pod kameny ještě dýchá řeka."},
  vodarna: {name: "Vodárna", type: "Základna", hp: 4, rule: "Vydrží 4 zásahy. Po vyčerpání odolnosti padne.", flavor: "Za těmito vraty má i jediná kapka cenu."},
  bunkr: {name: "Bunkr", type: "Základna", hp: 5, rule: "Vydrží 5 zásahů. Po vyčerpání odolnosti padne.", flavor: "Beton si pamatuje déle než lidé."}
};

const WATER_CAP = 5;
const SAVE_VERSION = 1;
const DRAW = ["pumpar", "pramen", "bara", "pumpar", "bara", "pramen"];
const basePair = () => ["vodarna", "bunkr"].map(id => ({id, hp: CARDS[id].hp}));

function newGame() {
  return {version: SAVE_VERSION, round: 1, water: 3, hand: ["pumpar","bara","pramen"],
    units: [null, null], playerBases: basePair(), enemyBases: basePair(),
    drawIndex: 0, result: null, log: [{round: 1, text: "Obě osady obsadily základny."}]};
}

function isGame(value) {
  const int = (n, min, max = Number.MAX_SAFE_INTEGER) => Number.isSafeInteger(n) && n >= min && n <= max;
  const bases = list => Array.isArray(list) && list.length === 2 && list.every((b, i) =>
    b && b.id === ["vodarna","bunkr"][i] && int(b.hp, 0, CARDS[b.id].hp));
  return !!(value && value.version === SAVE_VERSION && int(value.round, 1) && int(value.water, 0, WATER_CAP)
    && int(value.drawIndex, 0) && Array.isArray(value.hand) && value.hand.length <= 5
    && value.hand.every(id => ["pumpar","bara","pramen"].includes(id))
    && Array.isArray(value.units) && value.units.length === 2 && value.units.every(u => u === null ||
      (u && ["pumpar","bara"].includes(u.id) && typeof u.ready === "boolean" && int(u.uses, 1, 2)))
    && bases(value.playerBases) && bases(value.enemyBases) && [null,"win","lose"].includes(value.result)
    && Array.isArray(value.log) && value.log.length <= 12 && value.log.every(l => l && int(l.round, 1) && typeof l.text === "string"));
}

function record(state, text) {
  state.log.unshift({round: state.round, text});
  state.log.length = Math.min(state.log.length, 12);
}

function allowed(state, action) {
  if (state.result) return "Partie skončila.";
  const {type, hand, slot, base} = action;
  if (type === "end") return "";
  if (type === "attack") {
    if (!state.units[slot]?.ready) return "Tento přeživší už v tomto kole vyrazil.";
    if (!state.enemyBases[base]?.hp) return "Vyber stojící soupeřovu základnu.";
    return "";
  }
  const card = CARDS[state.hand[hand]];
  if (!card) return "Vyber kartu z ruky.";
  if (state.water < card.cost) return "Na tuto kartu chybí voda.";
  if (type === "spring") {
    if (card.type !== "Operace") return "Vyber Skrytý pramen.";
    return state.water === WATER_CAP ? "Zásoba vody je plná." : "";
  }
  if (type === "deploy") {
    if (card.type !== "Přeživší") return "Do pozice lze nasadit přeživšího.";
    if (![0,1].includes(slot) || state.units[slot]) return "Vyber volnou pozici.";
    return "";
  }
  return "Neznámá akce.";
}

// All moves return a new state. Invalid moves preserve the original object.
function play(state, action) {
  const error = allowed(state, action);
  if (error) return {state, error};
  const next = JSON.parse(JSON.stringify(state));
  let message = "";
  if (action.type === "deploy") {
    const [id] = next.hand.splice(action.hand, 1);
    next.water -= CARDS[id].cost;
    next.units[action.slot] = {id, ready: true, uses: CARDS[id].uses};
    message = `${CARDS[id].name} na frontě. Vyber cíl výpadu.`;
  } else if (action.type === "spring") {
    next.hand.splice(action.hand, 1);
    const gain = Math.min(2, WATER_CAP - next.water);
    next.water += gain;
    message = `Skrytý pramen doplnil vodu (+${gain}).`;
  } else if (action.type === "attack") {
    const unit = next.units[action.slot];
    const target = next.enemyBases[action.base];
    const card = CARDS[unit.id];
    target.hp = Math.max(0, target.hp - card.attack);
    if (unit.id === "pumpar") next.water = Math.min(WATER_CAP, next.water + 1);
    unit.ready = false;
    if (--unit.uses === 0) next.units[action.slot] = null;
    message = `${card.name} → ${CARDS[target.id].name}. ${target.hp ? `Zbývá odolnost ${target.hp}.` : "Základna padla."}`;
    if (next.enemyBases.every(b => !b.hp)) next.result = "win";
  } else {
    // Each enemy base still standing sends one point of damage, in printed order.
    for (const attackingBase of next.enemyBases) {
      if (!attackingBase.hp) continue;
      const target = next.playerBases.find(b => b.hp);
      if (!target) break;
      target.hp--;
      record(next, `Soupeřův výpad zasáhl tvou základnu ${CARDS[target.id].name}. ${target.hp ? `Odolnost ${target.hp}.` : "Základna padla."}`);
    }
    if (next.playerBases.every(b => !b.hp)) {
      next.result = "lose";
      message = "Obě tvé základny padly.";
    } else {
      next.round++;
      next.water = Math.min(WATER_CAP, next.water + 2);
      for (const unit of next.units) if (unit) unit.ready = true;
      if (next.hand.length < 5) {
        const id = DRAW[next.drawIndex++ % DRAW.length];
        next.hand.push(id);
        message = `Začíná kolo ${next.round}. Dobíráš kartu ${CARDS[id].name}.`;
      } else message = `Začíná kolo ${next.round}. Ruka je plná.`;
    }
  }
  record(next, message);
  return {state: next, error: "", message};
}

function inspector() {

    status = "V RUCE";
    if (c.type==="Přeživší") {
      const error = allowed(state,{type:"deploy",hand:pick.i,slot});
      controls = button("deploy","Nasadit do pozice "+(slot === -1 ? "" : pad(slot+1)),"plus","secondary-action",`data-i="${slot}" ${no(error)}`);

    } else {
      const error = allowed(state,{type:"spring",hand:pick.i});
      controls = button("spring","Čerpat vodu","water","secondary-action",no(error));
      hint = error || "Operace se po zahrání odloží.";

    status = u.ready ? "NA FRONTĚ" : "PO VÝPADU";

let returnFocus;
function modal(title, html, eyebrow="POLNÍ PŘÍRUČKA") {
 if (!dialog.open) returnFocus = document.activeElement;
 document.querySelector("#dialog-body").innerHTML = `<div class="modal-top"><span class="micro">${eyebrow}</span>${button("close","","close","icon-btn",'aria-label="Zavřít"')}</div><h2 id="modal-title">${title}</h2>${html}`;
 dialog.setAttribute("aria-labelledby","modal-title");
 if (!dialog.open) dialog.showModal();
 dialog.querySelector("button")?.focus();
}
dialog.addEventListener("close",()=>returnFocus?.isConnected && returnFocus.focus({preventScroll:true}));
dialog.addEventListener("click",event=>{if(event.target===dialog) {const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)dialog.close();}});
function rules() {
 modal("Jak hrát",`<strong class="demo-tag">Pravidla zkušebního scénáře</strong><p>Znič obě soupeřovy základny dřív, než soupeř zničí ty tvoje. Tento scénář používá zkušební hodnoty a efekty.</p><ol class="rule-list"><li><b>Nasaď přeživšího.</b> Vyber kartu z ruky a volnou pozici na linii střetu. Zaplatíš cenu v kapkách.</li><li><b>Vyraz k základně.</b> Vyber připraveného přeživšího a klikni na soupeřovu základnu. Každý může útočit jednou za kolo. Po druhém výpadu odejde.</li><li><b>Čerpej vodu.</b> Začínáš se třemi kapkami. Skrytý pramen doplní až dvě, Pumpař po výpadu jednu. Do zásoby se vejde pět.</li><li><b>Ukonči tah.</b> Každá stojící soupeřova základna způsobí jeden zásah. Nejdřív zasahují tvou Vodárnu, pak Bunkr.</li><li><b>Pokračuj dalším kolem.</b> Přeživší se připraví, doplníš až dvě vody a dobereš kartu do limitu pěti. Poškození základen trvá.</li></ol>${button("close","Zpět ke hře","","primary-action")}`);
}
function handleMove(action) {
 const result=play(state,action);
 if(result.error) {message=result.error;notice(message);render();return;}
 state=result.state;
 message=result.message;
 if(action.type==="deploy") {pick={zone:"unit",i:action.slot}; message="Vyber soupeřovu základnu pro výpad.";}
 else if(action.type==="attack" || action.type==="end" || action.type==="spring") pick=initialPick();
 persist(); render(); notice(result.message);
 if(state.result) modal(state.result==="win"?"Vítězství":"Porážka",`<p>${state.result==="win"?"Obě soupeřovy základny padly. Tvoje osada udržela přístup k vodě.":"Obě tvé základny padly. Soupeř ovládl zdroj vody."}</p><div class="modal-actions">${button("close","Prohlédnout stůl","","secondary-action")}${button("new","Nová partie","","primary-action")}</div>`,"KONEC PARTIE");
}
document.addEventListener("click",event=>{
 const t=event.target.closest("button[data-a]");
 if(!t||t.disabled) return;
 const i=Number(t.dataset.i), a=t.dataset.a;
 if(a==="go") go(t.dataset.page);
 else if(a==="family") {category=t.dataset.family;render();app.querySelector(`[data-a="family"][data-family="${category}"]`)?.focus({preventScroll:true});}
 else if(a==="rules") rules();
 else if(a==="close") dialog.close();
 else if(a==="log") modal("Záznam partie",`<ol class="log-list">${state.log.map(l=>`<li><b>K${pad(l.round)}</b>${esc(l.text)}</li>`).join("")}</ol>`,"POLNÍ DENÍK");
 else if(a==="restart") modal("Zahájit novou partii?",`<p>Rozehranou pozici nahradí nová osada se třemi kartami v ruce.</p><div class="modal-actions">${button("close","Pokračovat ve hře","","secondary-action")}${button("new","Nová partie","restart","primary-action")}</div>`,"BOJ O VODU");
 else if(a==="new") {
   dialog.close();state=newGame();pick=initialPick();message="";persist();go("game");notice("Nová partie.");
 }
 else if(a==="select") {pick={zone:t.dataset.z,i};message="";render();notice("Vybraná karta "+CARDS[selectedId()].name+".");}
 else if(a==="deploy") handleMove({type:"deploy",hand:pick.i,slot:i});
 else if(a==="attack") handleMove({type:"attack",slot:pick.i,base:i});
 else if(a==="spring") handleMove({type:"spring",hand:pick.i});
 else if(a==="end") handleMove({type:"end"});
 else if(a==="card") showPainting(t.dataset.id);

});
let currentPainting=null;
function galleryOrder() {
  return (page==="cards" ? matched() : library).filter(row=>row.status==="generated");
}
function showPainting(id) {
  const order=galleryOrder();
  const index=order.findIndex(item=>item.filename===id+".avif");
  if(index<0) return;
  const row=order[index], c=CARDS[id], isBase=row.category==="zakladny";
  const art=`<div class="modal-card-art collection-full ${isBase?"base":""}">${img(id,"",false,row.name)}</div>`;
  const meta=c ? c.type+" · "+(c.cost!==undefined?"Cena "+c.cost+" vody":"Odolnost "+c.hp) : cardTypes[row.category]+" · "+row.aspect_ratio;
  const rule=c?`<p>${esc(c.rule)}</p><p class="flavor">„${esc(c.flavor)}“</p>`:"";
  const adjacent=(step,label)=>button("card",label,"","gallery-step",order[index+step]?`data-id="${esc(order[index+step].filename.split(".")[0])}"`:"disabled");
  const browse=`<div class="gallery-pager">${adjacent(-1,"← Předchozí")}<span>${pad(index+1)} / ${pad(order.length)}</span>${adjacent(1,"Další →")}</div>`;
  currentPainting=id;
  modal(esc(row.name),art+`<div class="micro card-meta">${esc(meta)}</div>`+rule+browse,"REJSTŘÍK KARET");
}
dialog.addEventListener("close",()=>{currentPainting=null;});
document.addEventListener("keydown",event=>{
  if(!dialog.open || !currentPainting || !["ArrowLeft","ArrowRight"].includes(event.key)) return;
  event.preventDefault();
  const order=galleryOrder();
  const next=order[order.findIndex(row=>row.filename===currentPainting+".avif")+(event.key==="ArrowLeft"?-1:1)];
  if(next) showPainting(next.filename.split(".")[0]);
});
function updateRows() {const el=document.getElementById("rows");if(el) el.innerHTML=catalogRows();}
document.addEventListener("input",event=>{if(event.target.id==="q"){query=event.target.value;updateRows();}});
document.addEventListener("change",event=>{
 if(event.target.id==="category") category=event.target.value; else if(event.target.id==="status") filter=event.target.value; else return;
 updateRows();
});
window.addEventListener("popstate",()=>{page=Object.hasOwn(pages,location.hash.slice(1))?location.hash.slice(1):"game";render();});
render();

}
</script>
</body>
</html>
